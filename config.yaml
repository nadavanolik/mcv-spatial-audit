# Design matrix profiles, read by src/build_manifest.py --profile <name>.
#
# Size: variants = regions x (1 control + corruptions x severities x area_bins);
# stage 3 sends two requests (SC + PQ) per variant.

pilot:
  n_bases: 5
  corruptions: [none, blur, remove]
  severities: [1, 3]
  area_bins: [full]
  # ~80 variants, a few minutes of judging.

main:
  # The reported design: 150 photos, 476 regions, 11 variants per region
  # (1 control + 5 corruptions x 2 severities) = 5,236 variants.
  n_bases: 150
  corruptions: [none, blur, saturate, noise, jpeg, remove]
  severities: [1, 3]
  area_bins: [full]

nuisance150:
  # The 476 clean edits only, for the nuisance and exploitability conditions
  # (stage 3 --presentation). Their variant ids match `main`'s controls.
  # severities/area_bins are unused for `none` but required.
  n_bases: 150
  corruptions: [none]
  severities: [1, 3]
  area_bins: [full]

full_cross:
  # 24,800 variants / 99,200 requests. Not run.
  n_bases: 200
  corruptions: [none, blur, saturate, noise, jpeg, remove]
  severities: [1, 2, 3]
  area_bins: [full, half]

# Photo and region selection, read by src/stage0_coco.py.
selection:
  min_regions: 3
  max_regions: 5
  min_area_frac: 0.02
  max_area_frac: 0.25
  duplicate_area_frac: 0.01

# The judges in the report (for reference; pass one with stage 3 --model).
#   Qwen3-VL-8B-Instruct is the base model of SpatialFlow-GRPO's reward model.
#   InternVL3-8B has its own vision encoder; it ran with --max-dynamic-patch 6
#   --max-model-len 8192. Both used --bbox-frame norm1000.
judges:
  - Qwen/Qwen3-VL-8B-Instruct
  - OpenGVLab/InternVL3-8B
